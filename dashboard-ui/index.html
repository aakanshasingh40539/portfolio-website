<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="dashboard">

        <div class="sidebar" id="sidebar">
            <h2>Dashboard</h2>
            <ul>
                <li>Home</li>
                <li>Users</li>
                <li>Analytics</li>
                <li>Settings</li>
            </ul>
        </div>

        <div class="main">

            <div class="topbar">
                <button id="toggleBtn">☰</button>
                <input type="text" id="search" placeholder="Search user...">
                <button id="darkMode">🌙</button>
            </div>

            <h1>Admin Dashboard</h1>

            <div class="cards">

                <div class="card">
                    <h3>Total Users</h3>
                    <p>1240</p>
                </div>

                <div class="card">
                    <h3>Orders</h3>
                    <p>320</p>
                </div>

                <div class="card">
                    <h3>Revenue</h3>
                    <p>$12,400</p>
                </div>

            </div>

            <table id="userTable">
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Status</th>
                </tr>

                <tr>
                    <td>John</td>
                    <td>john@email.com</td>
                    <td>Active</td>
                </tr>

                <tr>
                    <td>Emma</td>
                    <td>emma@email.com</td>
                    <td>Active</td>
                </tr>

                <tr>
                    <td>David</td>
                    <td>david@email.com</td>
                    <td>Inactive</td>
                </tr>

                <tr>
                    <td>Sarah</td>
                    <td>sarah@email.com</td>
                    <td>Active</td>
                </tr>

            </table>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
